version: '3.8'

services:
  # Service Node.js
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=stock_db
      - PGUSER=postgres
      - PGPASSWORD=postgres
    depends_on:
      - postgres

  # Service PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
