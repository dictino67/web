services:
  web:
    build:
      context: ..
      dockerfile: stock-app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PGHOST=192.168.0.120
      - PGPORT=5432
      - PGDATABASE=n8_db
      - PGUSER=n8n
      - PGPASSWORD=secret
    command: >-
      sh -c "psql -v ON_ERROR_STOP=1 -f database/schema.sql && node server.js"
