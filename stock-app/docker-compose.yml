services:
  web:
    build:
      context: ..
      dockerfile: stock-app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=stock_fournitures
      - PGUSER=postgres
      - PGPASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "psql -v ON_ERROR_STOP=1 -f database/schema.sql && node server.js"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stock_fournitures
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_fournitures"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
