<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajouter un produit | Stock fournitures</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">S</span><span>Stock<span class="brand-accent">Pilot</span></span></a>
    <nav aria-label="Navigation principale">
      <a class="nav-link active" href="index.html">Home</a>
      <a class="nav-link" href="list.html">Liste des produits</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="intro">
      <p class="eyebrow">Inventaire / Nouveau produit</p>
      <h1>Ajouter une fourniture</h1>
      <p class="intro-copy">Enregistrez une nouvelle référence et gardez votre stock lisible, précis et à jour.</p>
    </section>

    <section class="form-panel" aria-labelledby="form-title">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">Fiche produit</p>
          <h2 id="form-title">Informations essentielles</h2>
        </div>
        <span class="required-note">* Champs obligatoires</span>
      </div>
      <form id="product-form" enctype="multipart/form-data">
        <div class="form-grid">
          <label class="field field-wide" for="nom_produit">Nom du produit *
            <input id="nom_produit" name="nom_produit" type="text" maxlength="160" placeholder="Ex. Ramettes de papier A4" required>
          </label>
          <label class="field" for="quantite_stock">Quantité en stock *
            <input id="quantite_stock" name="quantite_stock" type="number" min="0" step="1" placeholder="0" required>
          </label>
          <label class="field" for="lieu">Lieu de stockage *
            <input id="lieu" name="lieu" type="text" maxlength="160" placeholder="Ex. Réserve B - Étagère 3" required>
          </label>
          <label class="field field-wide" for="description">Description *
            <textarea id="description" name="description" rows="4" maxlength="2000" placeholder="Décrivez le format, la marque ou toute information utile..." required></textarea>
          </label>
          <label class="field field-wide upload-field" for="image">Image du produit *
            <span class="upload-box"><span class="upload-icon">↑</span><span><strong>Choisir une image</strong><small>JPG, PNG, GIF ou WebP · 5 Mo maximum</small></span></span>
            <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp" required>
            <span id="file-name" class="file-name">Aucun fichier sélectionné</span>
          </label>
        </div>
        <div class="form-actions">
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <button class="button button-primary" type="submit"><span>Enregistrer le produit</span><span aria-hidden="true">→</span></button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
