<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des produits | Stock fournitures</title>
  <link rel="stylesheet" href="styles.css">
  <script src="list.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">S</span><span>Stock<span class="brand-accent">Pilot</span></span></a>
    <nav aria-label="Navigation principale">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link active" href="list.html">Liste des produits</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="intro list-intro">
      <div>
        <p class="eyebrow">Inventaire / Vue générale</p>
        <h1>Produits en stock</h1>
        <p class="intro-copy">Retrouvez chaque fourniture, son emplacement et son niveau disponible.</p>
      </div>
      <a class="button button-primary" href="index.html"><span>Ajouter un produit</span><span aria-hidden="true">+</span></a>
    </section>

    <section class="list-panel" aria-labelledby="list-title">
      <div class="panel-heading list-heading">
        <div><p class="section-kicker">Catalogue</p><h2 id="list-title">Toutes les références</h2></div>
        <span id="record-count" class="record-count">Chargement...</span>
      </div>
      <p id="list-message" class="list-message" role="status" aria-live="polite"></p>
      <div id="product-list" class="product-list"></div>
      <div class="pagination">
        <button id="previous-button" class="button button-secondary" type="button" disabled>← Précédent</button>
        <span id="page-indicator">Page 1</span>
        <button id="next-button" class="button button-secondary" type="button" disabled>Suivant →</button>
      </div>
    </section>
  </main>
</body>
</html>
